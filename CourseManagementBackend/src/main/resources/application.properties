# -------------------------------
# Application Name & Server Port
# -------------------------------
spring.application.name=CourseManagementBackend
server.port=${PORT:8080}

# -------------------------------
# MySQL Database (Railway) - Auto parse from MYSQL_URL
# -------------------------------
# Convert Railway URL to JDBC format dynamically
spring.datasource.url=${MYSQL_PUBLIC_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:course_management}?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#

# -------------------------------
# JPA / Hibernate
# -------------------------------
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# -------------------------------
# Optional HikariCP Connection Pool
# -------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SpringBootHikariCP
spring.datasource.hikari.max-lifetime=1800000


