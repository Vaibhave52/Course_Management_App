# -------------------------------
# Application Name & Server Port
# -------------------------------
spring.application.name=CourseManagementBackend
server.port=${PORT:8080}       # Railway will inject the port

# -------------------------------
# MySQL Database (Railway)
# -------------------------------
spring.datasource.url=${MYSQL_PUBLIC_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# -------------------------------
# JPA / Hibernate
# -------------------------------
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Disable Open Session In View to avoid LazyInitializationException
spring.jpa.open-in-view=false

